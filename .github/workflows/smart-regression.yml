name: Smart Playwright Regression CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base Git commit or branch to compare against'
        required: false
        default: 'HEAD~1'

permissions:
  contents: read
  pull-requests: write

jobs:
  smart-regression:
    name: AI Regression Selection & Execution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so base and head can be compared

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Project
        run: npm run build

      - name: Run Smart Regression Analysis
        id: selector
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || inputs.base_ref || 'HEAD~1' }}
        run: |
          node dist/cli/index.js analyze --base "$BASE_REF" --head ${{ github.sha }} --output pr-report.md
          # Display directly on the GitHub Actions Run Summary tab:
          cat pr-report.md >> $GITHUB_STEP_SUMMARY

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr-report.md')) {
              const body = fs.readFileSync('pr-report.md', 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const botComment = comments.find(c => c.body.includes('🤖 Playwright Smart Regression Selection Report'));
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            }

      - name: Execute Selected Regression Tests
        env:
          BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || inputs.base_ref || 'HEAD~1' }}
        run: |
          node dist/cli/index.js run --base "$BASE_REF" --head ${{ github.sha }} --dry-run
