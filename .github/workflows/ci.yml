name: CI & NPM Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

  # ── Supply Chain Security ────────────────────────────────────────────────────
  # All tools below are 100% free for public repositories.

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required by dependency-review to post PR comments

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. npm audit — catches known CVEs in the npm advisory database (built-in, free)
      - name: npm audit
        run: npm audit --audit-level=moderate

      # 2. Socket.dev — catches supply chain risks: typosquatting, malware,
      #    deprecated packages, install scripts, obfuscated code, etc.
      #    Free for public repos via their GitHub Action.
      - name: Socket Security Scan
        uses: SocketDev/socket-workflow-action@v2
        with:
          organization-slug: ujjwal-s-s

  # 3. GitHub Dependency Review — runs on PRs only, blocks merging of
  #    newly introduced vulnerable or unlicensed dependencies. Free for all public repos.
  dependency-review:
    name: Dependency Review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  # ── Publish ──────────────────────────────────────────────────────────────────
  publish-npm:
    name: Publish to NPM Registry
    needs: [test-and-build, supply-chain]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js for NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish Package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public || echo "Package version already exists or publish failed gracefully"
